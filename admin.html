<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>إدارة البراشية أون لاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#fff;--ink:#12332B;--mute:#4A5F58;--line:#E4DCCB;--g:#1F6B52;--gt:#fff;--o:#E08A2E;--ot:#12332B;--red:#B3261E;--chip:#DDE9E3;--star:#E0A100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1D19;--card:#172A24;--ink:#EEF3F0;--mute:#A7BAB2;--line:#26413A;--g:#2E8B6B;--red:#F2766D;--chip:#1F3A32;--star:#F2B93B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:8px 0 12px}
h2{font-size:17px;margin:14px 0 8px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
textarea{padding:10px 12px;min-height:70px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;border:0;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:var(--g);color:var(--gt)}
.btn.o{background:var(--o);color:var(--ot)}
.btn.s{background:var(--chip);color:var(--ink)}
.btn.r{background:transparent;color:var(--red);border:1px solid var(--red)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nm{font-weight:800;font-size:16px}
.sub{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--chip)}
.tag.off{background:#F7DDDA;color:#7A1812}
.tag.wait{background:#FFE9C7;color:#6B4200}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tab{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.st{color:var(--star)}
#msg{font-size:14px;color:var(--mute);min-height:22px}
.hide{display:none}
.msgs{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--card);margin:8px 0}
.m{max-width:85%;padding:8px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.m.u{background:var(--chip)}
.m.a{background:var(--g);color:var(--gt);margin-inline-start:auto}
</style>
</head>
<body>
<div class="wrap">
<h1>لوحة إدارة البراشية أون لاين</h1>

<form id="lf" class="box">
  <label>البريد الإلكتروني<input id="em" type="email" required autocomplete="username"></label>
  <label>كلمة المرور<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">دخول</button>
</form>

<div id="app" class="hide">
  <div class="row" style="justify-content:space-between"><span id="cnt" class="sub"></span><button class="btn s" id="out" type="button">خروج</button></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-t="p" aria-pressed="true" type="button">الخدمات</button>
    <button class="tab" data-t="r" aria-pressed="false" type="button">التقييمات</button>
    <button class="tab" data-t="s" aria-pressed="false" type="button">المقترحات</button>
    <button class="tab" data-t="n" aria-pressed="false" type="button">الإعلانات</button>
    <button class="tab" data-t="c" aria-pressed="false" type="button">الاستفسارات</button>
    <button class="tab" data-t="a" aria-pressed="false" type="button">إضافة خدمة</button>
  </div>

  <section id="tp">
    <input id="q" type="search" placeholder="ابحث بالاسم أو الهاتف">
    <div class="tabs" id="ftabs">
      <button class="tab" data-f="all" aria-pressed="true" type="button">الكل</button>
      <button class="tab" data-f="on" aria-pressed="false" type="button">ظاهر</button>
      <button class="tab" data-f="off" aria-pressed="false" type="button">مخفي</button>
    </div>
    <div id="plist"></div>
  </section>

  <section id="tr" class="hide"><div id="rlist"></div></section>
  <section id="ts" class="hide"><div id="slist"></div></section>

  <section id="tn" class="hide">
    <form id="nf" class="box">
      <b>إعلان جديد في الصفحة الرئيسية</b>
      <label>النوع<select id="nty"><option>فرح</option><option>وفاة</option><option>مناسبة</option></select></label>
      <label>العنوان<input id="nti" required maxlength="100"></label>
      <label>التفاصيل<textarea id="nx" maxlength="400"></textarea></label>
      <label>الموعد (نص حر)<input id="ndt" maxlength="80" placeholder="مثال: الجمعة بعد العصر"></label>
      <label>المكان<input id="npl" maxlength="100"></label>
      <label>يظهر حتى تاريخ (اختياري)<input id="nu" type="date"></label>
      <button class="btn o" type="submit">نشر الإعلان</button>
    </form>
    <div id="nlist"></div>
  </section>

  <section id="tc" class="hide">
    <div id="clist"></div>
    <div id="cview" class="hide box">
      <div class="row" style="justify-content:space-between"><b id="ctitle"></b><span class="row"><button class="btn r" id="cdel" type="button">حذف المحادثة</button><button class="btn s" id="cback" type="button">رجوع</button></span></div>
      <div class="msgs" id="cmsgs"></div>
      <div class="row"><input id="cr" maxlength="500" placeholder="اكتب ردّك" style="flex:1"><button class="btn" id="csend" type="button">إرسال</button></div>
    </div>
  </section>

  <section id="ta" class="hide">
    <form id="af" class="box">
      <label>الاسم<input id="an" required></label>
      <label>القسم<select id="ac"></select></label>
      <label>الهاتف<input id="ap" required inputmode="tel"></label>
      <label>الواتساب<input id="aw" inputmode="tel"></label>
      <label>العنوان<input id="aa"></label>
      <label>المواعيد<input id="ah"></label>
      <label>الوصف<textarea id="ad"></textarea></label>
      <label>رابط فيسبوك<input id="afb"></label>
      <button class="btn o" type="submit">إضافة</button>
    </form>
    <button class="btn s" id="imp" type="button">استيراد الأسماء القديمة (٣)</button>
  </section>
</div>
<p id="msg" role="status"></p>
</div>

<script>
var FB="https://firestore.googleapis.com/v1/projects/barashia-online/databases/(default)/documents";
var KEY="AIzaSyAkTo0Bw-UlRK-6KRzIpaPjJbESufhezeA";
var AUTH="https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+KEY;
var REFRESH="https://securetoken.googleapis.com/v1/token?key="+KEY;
var CATS=["أطباء","صيدليات","سباكة","كهرباء","نجارة","مواصلات","محلات","مطاعم","أخرى"];
var LEGACY=[
  {n:"Shahino AI",c:"أخرى",p:"01050766025",a:"شارع البحر",h:"١٢ ص إلى ١٢ م"},
  {n:"ماركت أولاد ضياء النجار",c:"محلات",p:"01223510363",a:"بجوار محطة الرفع، منزل الحاج رجب طرية",h:"من ٩ صباحًا إلى ٣ بعد منتصف الليل"},
  {n:"وليد صبري",c:"مواصلات",p:"01009358868",a:"البراشية",h:"٢٤ ساعة"}
];
var tok=null,rtok=null,items=[],revs=[],sugs=[],anns=[],chats=[],flt="all",editing=null,curChat=null,timer=null;
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function att(s){return esc(s).replace(/"/g,"&quot;")}
function say(t){$("msg").textContent=t||""}
function sv(f,k){return f&&f[k]&&f[k].stringValue!=null?f[k].stringValue:""}
function nv(f,k){if(!f||!f[k])return null;var v=f[k];if(v.doubleValue!=null)return +v.doubleValue;if(v.integerValue!=null)return +v.integerValue;return null}
function on(f){return !!(f.approved&&f.approved.booleanValue)}
function S(v,n){return {stringValue:String(v==null?"":v).slice(0,n)}}
function stars(n){return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}
function idOf(d){return d.name.split("/").pop()}

function refresh(){
  return fetch(REFRESH,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(rtok)})
  .then(function(r){return r.json()}).then(function(j){if(!j.id_token)throw new Error("x");tok=j.id_token;rtok=j.refresh_token||rtok});
}
function api(url,opt,retried){
  opt.headers={"Content-Type":"application/json","Authorization":"Bearer "+tok};
  return fetch(url,opt).then(function(r){
    if(r.status===401&&!retried&&rtok){return refresh().then(function(){return api(url,opt,true)})}
    return r;
  });
}
function fail(r){say(r&&r.status===403?"ليس لديك صلاحية. تأكد من القواعد وبريد الأدمن.":"حصلت مشكلة. حاول مرة أخرى.")}
function runQ(parent,q){
  return api(FB+(parent||"")+":runQuery?key="+KEY,{method:"POST",body:JSON.stringify({structuredQuery:q})})
  .then(function(r){if(!r.ok){fail(r);throw new Error("q")}return r.json()})
  .then(function(d){return (Array.isArray(d)?d:[]).filter(function(x){return x.document}).map(function(x){return x.document})});
}
function all(c,lim){return runQ("",{from:[{collectionId:c}],limit:lim||1000})}
function patch(path,fields,mask){return api(FB+path+"?key="+KEY+mask.map(function(m){return "&updateMask.fieldPaths="+m}).join(""),{method:"PATCH",body:JSON.stringify({fields:fields})})}
function del(path){return api(FB+path+"?key="+KEY,{method:"DELETE"})}
function add(c,fields){return api(FB+"/"+c+"?key="+KEY,{method:"POST",body:JSON.stringify({fields:fields})})}
function sure(t){return confirm("حذف نهائي: "+t+"؟ لا يمكن التراجع.")}
function byT(a,b){return a.t<b.t?1:a.t>b.t?-1:0}

$("lf").addEventListener("submit",function(e){
  e.preventDefault();say("جاري الدخول...");
  fetch(AUTH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value,returnSecureToken:true})})
  .then(function(r){return r.json()}).then(function(j){
    if(j.idToken){tok=j.idToken;rtok=j.refreshToken;$("pw").value="";$("lf").classList.add("hide");$("app").classList.remove("hide");say("");loadAll()}
    else say("بيانات الدخول غير صحيحة.");
  }).catch(function(){say("تعذّر الاتصال.")});
});
$("out").addEventListener("click",function(){tok=rtok=null;clearInterval(timer);$("app").classList.add("hide");$("lf").classList.remove("hide");say("")});

function loadAll(){
  all("providers").then(function(ds){
    items=ds.map(function(d){var f=d.fields||{};return {id:idOf(d),n:sv(f,"n"),c:sv(f,"c"),p:sv(f,"p"),w:sv(f,"w"),a:sv(f,"a"),h:sv(f,"h"),d:sv(f,"d"),fb:sv(f,"fb"),hv:!!(f.hv&&f.hv.booleanValue),lat:nv(f,"lat"),lng:nv(f,"lng"),t:sv(f,"t"),on:on(f)}}).sort(byT);
    return all("reviews",2000);
  }).then(function(ds){
    revs=ds.map(function(d){var f=d.fields||{};return {id:idOf(d),pid:sv(f,"pid"),n:sv(f,"n"),s:nv(f,"s")||0,x:sv(f,"x"),t:sv(f,"t"),on:on(f)}}).sort(byT);
    return all("suggestions",500);
  }).then(function(ds){
    sugs=ds.map(function(d){var f=d.fields||{};return {id:idOf(d),n:sv(f,"n"),c:sv(f,"c"),ti:sv(f,"ti"),x:sv(f,"x"),rp:sv(f,"rp"),t:sv(f,"t"),on:on(f)}}).sort(byT);
    return all("announcements",300);
  }).then(function(ds){
    anns=ds.map(function(d){var f=d.fields||{};return {id:idOf(d),ty:sv(f,"ty"),ti:sv(f,"ti"),x:sv(f,"x"),dt:sv(f,"dt"),pl:sv(f,"pl"),u:sv(f,"u"),t:sv(f,"t"),on:on(f)}}).sort(byT);
    return runQ("",{from:[{collectionId:"chats"}],orderBy:[{field:{fieldPath:"t"},direction:"DESCENDING"}],limit:200});
  }).then(function(ds){
    chats=ds.map(function(d){var f=d.fields||{};return {id:idOf(d),n:sv(f,"n"),last:sv(f,"last"),t:sv(f,"t"),from:sv(f,"from")}});
    renderAll();
  }).catch(function(){say("تعذّر تحميل البيانات.")});
}
function renderAll(){
  $("cnt").textContent="الخدمات: "+items.length+" • التقييمات: "+revs.length+" • المقترحات: "+sugs.length+" • الإعلانات: "+anns.length+" • الاستفسارات: "+chats.length;
  renderP();renderR();renderS();renderN();renderC();
}
function nameOf(pid){var x=items.filter(function(i){return i.id===pid})[0];return x?x.n:"(غير معروف)"}
function tag(o){return '<span class="tag'+(o?"":" off")+'">'+(o?"ظاهر":"مخفي")+'</span>'}
function btn(a,id,t,cls){return '<button class="btn '+(cls||"s")+'" data-a="'+a+'" data-id="'+att(id)+'" type="button">'+t+'</button>'}
function findIn(arr,id){return arr.filter(function(i){return i.id===id})[0]}

/* الخدمات */
function renderP(){
  var q=$("q").value.trim();
  var r=items.filter(function(x){if(flt==="on"&&!x.on)return false;if(flt==="off"&&x.on)return false;return !q||(x.n+" "+x.p+" "+x.c).indexOf(q)>-1});
  if(!r.length){$("plist").innerHTML='<div class="box sub">لا توجد نتائج.</div>';return}
  $("plist").innerHTML=r.map(function(x){
    if(editing==="p:"+x.id){
      return '<div class="box"><label>الاسم<input id="en" value="'+att(x.n)+'"></label>'+
      '<label>القسم<select id="ec">'+CATS.map(function(c){return '<option'+(c===x.c?" selected":"")+'>'+c+'</option>'}).join("")+'</select></label>'+
      '<label>الهاتف<input id="ep" value="'+att(x.p)+'"></label><label>الواتساب<input id="ew" value="'+att(x.w)+'"></label>'+
      '<label>العنوان<input id="ea" value="'+att(x.a)+'"></label><label>المواعيد<input id="eh" value="'+att(x.h)+'"></label>'+
      '<label>الوصف<textarea id="ed">'+esc(x.d)+'</textarea></label><label>فيسبوك<input id="efb" value="'+att(x.fb)+'"></label>'+
      '<label>خدمة منزلية / توصيل<select id="ehv"><option value="0"'+(x.hv?"":" selected")+'>لا</option><option value="1"'+(x.hv?" selected":"")+'>نعم</option></select></label>'+
      '<label>خط العرض (lat)<input id="elat" inputmode="decimal" value="'+att(x.lat==null?"":x.lat)+'"></label><label>خط الطول (lng)<input id="elng" inputmode="decimal" value="'+att(x.lng==null?"":x.lng)+'"></label>'+
      '<div class="row">'+btn("save",x.id,"حفظ","")+btn("cancel",x.id,"إلغاء")+'</div></div>';
    }
    return '<div class="box"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(x.n)+'</span>'+tag(x.on)+'</div>'+
    '<div class="sub">'+esc(x.c)+' • '+esc(x.p)+'</div><div class="sub">'+esc(x.a)+(x.h?" • "+esc(x.h):"")+'</div>'+(x.d?'<div class="sub">'+esc(x.d)+'</div>':'')+
    '<div class="row" style="margin-top:10px">'+btn("toggle",x.id,x.on?"إخفاء":"إظهار")+btn("edit",x.id,"تعديل")+btn("del",x.id,"حذف","r")+'</div></div>';
  }).join("");
}
$("plist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),x=findIn(items,id);
  if(a==="edit"){editing="p:"+id;renderP();return}
  if(a==="cancel"){editing=null;renderP();return}
  if(a==="toggle"){say("جاري التنفيذ...");patch("/providers/"+id,{approved:{booleanValue:!x.on}},["approved"]).then(function(r){if(r.ok){x.on=!x.on;say("تم.");renderAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})}
  if(a==="del"){
    if(!sure(x.n))return;say("جاري الحذف...");
    del("/providers/"+id).then(function(r){if(r.ok){items=items.filter(function(i){return i.id!==id});say("تم الحذف.");renderAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
  }
  if(a==="save"){
    var v={n:$("en").value.trim(),c:$("ec").value,p:$("ep").value.trim(),w:$("ew").value.trim(),a:$("ea").value.trim(),h:$("eh").value.trim(),d:$("ed").value.trim(),fb:$("efb").value.trim()};
    if(!v.n||!v.p){say("الاسم والهاتف مطلوبان.");return}
    var hvv=$("ehv").value==="1",la=parseFloat($("elat").value),ln=parseFloat($("elng").value);
    var f={n:S(v.n,80),c:S(v.c,30),p:S(v.p,20),w:S(v.w,20),a:S(v.a,120),h:S(v.h,80),d:S(v.d,300),fb:S(v.fb,200),hv:{booleanValue:hvv},lat:isNaN(la)?{nullValue:null}:{doubleValue:la},lng:isNaN(ln)?{nullValue:null}:{doubleValue:ln}};
    say("جاري الحفظ...");
    patch("/providers/"+id,f,["n","c","p","w","a","h","d","fb","hv","lat","lng"]).then(function(r){if(r.ok){editing=null;say("تم الحفظ.");loadAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
  }
});
$("q").addEventListener("input",renderP);
$("ftabs").addEventListener("click",function(e){var b=e.target.closest("button[data-f]");if(!b)return;flt=b.getAttribute("data-f");Array.prototype.forEach.call($("ftabs").children,function(c){c.setAttribute("aria-pressed",String(c===b))});renderP()});

/* التقييمات */
function renderR(){
  if(!revs.length){$("rlist").innerHTML='<div class="box sub">لا توجد تقييمات.</div>';return}
  $("rlist").innerHTML=revs.map(function(x){
    return '<div class="box"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(nameOf(x.pid))+'</span>'+tag(x.on)+'</div>'+
    '<div><b>'+esc(x.n)+'</b> <span class="st">'+stars(x.s)+'</span></div><div>'+esc(x.x)+'</div>'+
    '<div class="row" style="margin-top:8px">'+btn("toggle",x.id,x.on?"إخفاء":"إظهار")+btn("del",x.id,"حذف","r")+'</div></div>';
  }).join("");
}
$("rlist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),x=findIn(revs,id);
  say("جاري التنفيذ...");
  if(a==="toggle")patch("/reviews/"+id,{approved:{booleanValue:!x.on}},["approved"]).then(function(r){if(r.ok){x.on=!x.on;say("تم.");renderR()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
  if(a==="del"){if(!sure("هذا التقييم")){say("");return}del("/reviews/"+id).then(function(r){if(r.ok){revs=revs.filter(function(i){return i.id!==id});say("تم الحذف.");renderAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})}
});

/* المقترحات */
function renderS(){
  if(!sugs.length){$("slist").innerHTML='<div class="box sub">لا توجد مقترحات.</div>';return}
  $("slist").innerHTML=sugs.map(function(x){
    if(editing==="s:"+x.id){return '<div class="box"><div class="nm">'+esc(x.ti)+'</div><div>'+esc(x.x)+'</div><label style="margin-top:8px">ردّ الإدارة (يظهر للجميع)<textarea id="srp" maxlength="300">'+esc(x.rp)+'</textarea></label><div class="row">'+btn("save",x.id,"حفظ الرد","")+btn("cancel",x.id,"إلغاء")+'</div></div>'}
    return '<div class="box"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(x.ti)+'</span>'+tag(x.on)+'</div><div class="sub">'+esc(x.c)+' • '+esc(x.n||"بدون اسم")+' • '+esc(x.t.slice(0,10))+'</div><div>'+esc(x.x)+'</div>'+(x.rp?'<div class="sub">ردّك: '+esc(x.rp)+'</div>':'')+
    '<div class="row" style="margin-top:8px">'+btn("toggle",x.id,x.on?"إخفاء":"إظهار")+btn("edit",x.id,"رد")+btn("del",x.id,"حذف","r")+'</div></div>';
  }).join("");
}
$("slist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),x=findIn(sugs,id);
  if(a==="edit"){editing="s:"+id;renderS();return}
  if(a==="cancel"){editing=null;renderS();return}
  say("جاري التنفيذ...");
  if(a==="toggle")patch("/suggestions/"+id,{approved:{booleanValue:!x.on}},["approved"]).then(function(r){if(r.ok){x.on=!x.on;say("تم.");renderS()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
  if(a==="save"){var rp=$("srp").value.trim();patch("/suggestions/"+id,{rp:S(rp,300)},["rp"]).then(function(r){if(r.ok){x.rp=rp;editing=null;say("تم حفظ الرد.");renderS()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})}
  if(a==="del"){if(!sure(x.ti)){say("");return}del("/suggestions/"+id).then(function(r){if(r.ok){sugs=sugs.filter(function(i){return i.id!==id});say("تم الحذف.");renderAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})}
});

/* الإعلانات */
function renderN(){
  if(!anns.length){$("nlist").innerHTML='<div class="box sub">لا توجد إعلانات.</div>';return}
  $("nlist").innerHTML=anns.map(function(x){
    if(editing==="n:"+x.id){
      return '<div class="box"><label>النوع<select id="eny">'+["فرح","وفاة","مناسبة"].map(function(c){return '<option'+(c===x.ty?" selected":"")+'>'+c+'</option>'}).join("")+'</select></label>'+
      '<label>العنوان<input id="eti" value="'+att(x.ti)+'"></label><label>التفاصيل<textarea id="enx">'+esc(x.x)+'</textarea></label>'+
      '<label>الموعد<input id="edt" value="'+att(x.dt)+'"></label><label>المكان<input id="epl" value="'+att(x.pl)+'"></label>'+
      '<label>يظهر حتى<input id="enu" type="date" value="'+att(x.u)+'"></label><div class="row">'+btn("save",x.id,"حفظ","")+btn("cancel",x.id,"إلغاء")+'</div></div>';
    }
    return '<div class="box"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(x.ty)+' — '+esc(x.ti)+'</span>'+tag(x.on)+'</div><div>'+esc(x.x)+'</div><div class="sub">'+esc(x.dt)+(x.pl?" • "+esc(x.pl):"")+(x.u?" • حتى "+esc(x.u):"")+'</div>'+
    '<div class="row" style="margin-top:8px">'+btn("toggle",x.id,x.on?"إخفاء":"إظهار")+btn("edit",x.id,"تعديل")+btn("del",x.id,"حذف","r")+'</div></div>';
  }).join("");
}
$("nf").addEventListener("submit",function(e){
  e.preventDefault();say("جاري النشر...");
  add("announcements",{ty:S($("nty").value,20),ti:S($("nti").value.trim(),100),x:S($("nx").value.trim(),400),dt:S($("ndt").value.trim(),80),pl:S($("npl").value.trim(),100),u:S($("nu").value,10),approved:{booleanValue:true},t:S(new Date().toISOString(),40)})
  .then(function(r){if(r.ok){$("nf").reset();say("تم نشر الإعلان.");loadAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
});
$("nlist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),x=findIn(anns,id);
  if(a==="edit"){editing="n:"+id;renderN();return}
  if(a==="cancel"){editing=null;renderN();return}
  say("جاري التنفيذ...");
  if(a==="toggle")patch("/announcements/"+id,{approved:{booleanValue:!x.on}},["approved"]).then(function(r){if(r.ok){x.on=!x.on;say("تم.");renderN()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
  if(a==="save"){
    var f={ty:S($("eny").value,20),ti:S($("eti").value.trim(),100),x:S($("enx").value.trim(),400),dt:S($("edt").value.trim(),80),pl:S($("epl").value.trim(),100),u:S($("enu").value,10)};
    patch("/announcements/"+id,f,["ty","ti","x","dt","pl","u"]).then(function(r){if(r.ok){editing=null;say("تم الحفظ.");loadAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
  }
  if(a==="del"){if(!sure(x.ti)){say("");return}del("/announcements/"+id).then(function(r){if(r.ok){anns=anns.filter(function(i){return i.id!==id});say("تم الحذف.");renderAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})}
});

/* الاستفسارات */
function renderC(){
  if(!chats.length){$("clist").innerHTML='<div class="box sub">لا توجد استفسارات.</div>';return}
  $("clist").innerHTML=chats.map(function(x){
    return '<div class="box" data-open="'+att(x.id)+'" style="cursor:pointer"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(x.n||"زائر")+'</span>'+(x.from==="user"?'<span class="tag wait">بانتظار الرد</span>':'<span class="tag">تم الرد</span>')+'</div><div class="sub">'+esc(x.last)+'</div><div class="sub">'+esc(x.t.slice(0,16).replace("T"," "))+'</div></div>';
  }).join("");
}
$("clist").addEventListener("click",function(e){var c=e.target.closest("[data-open]");if(c)openChat(c.getAttribute("data-open"))});
function pollMsgs(){
  if(!curChat)return;
  runQ("/chats/"+curChat,{from:[{collectionId:"messages"}],orderBy:[{field:{fieldPath:"t"},direction:"ASCENDING"}],limit:300}).then(function(ds){
    var h=ds.map(function(d){var f=d.fields||{};return '<div class="m '+(sv(f,"from")==="admin"?"a":"u")+'">'+esc(sv(f,"x"))+'</div>'}).join("")||'<div class="sub">لا توجد رسائل.</div>';
    var b=$("cmsgs");if(b.getAttribute("data-h")!==h){b.innerHTML=h;b.setAttribute("data-h",h);b.scrollTop=b.scrollHeight}
  }).catch(function(){});
}
function openChat(id){
  curChat=id;var c=findIn(chats,id);
  $("ctitle").textContent=c?(c.n||"زائر"):"محادثة";$("clist").classList.add("hide");$("cview").classList.remove("hide");$("cmsgs").setAttribute("data-h","");
  pollMsgs();clearInterval(timer);timer=setInterval(pollMsgs,8000);
}
$("cback").addEventListener("click",function(){curChat=null;clearInterval(timer);$("cview").classList.add("hide");$("clist").classList.remove("hide");loadAll()});
$("cdel").addEventListener("click",function(){
  if(!curChat||!sure("هذه المحادثة"))return;var id=curChat;say("جاري الحذف...");
  runQ("/chats/"+id,{from:[{collectionId:"messages"}],limit:500}).then(function(ds){
    return Promise.all(ds.map(function(d){return del("/chats/"+id+"/messages/"+idOf(d))}));
  }).then(function(){return del("/chats/"+id)}).then(function(r){
    if(r.ok){curChat=null;clearInterval(timer);$("cview").classList.add("hide");$("clist").classList.remove("hide");say("تم الحذف.");loadAll()}else fail(r);
  }).catch(function(){say("تعذّر الاتصال.")});
});
$("csend").addEventListener("click",function(){
  var tx=$("cr").value.trim().slice(0,500);if(!tx||!curChat)return;var id=curChat,t=new Date().toISOString();$("cr").value="";
  add("chats/"+id+"/messages",{from:S("admin",10),x:S(tx,500),t:S(t,40)}).then(function(r){
    if(!r.ok){fail(r);$("cr").value=tx;return}
    return patch("/chats/"+id,{last:S(tx,200),t:S(t,40),from:S("admin",10)},["last","t","from"]).then(function(){pollMsgs()});
  }).catch(function(){say("تعذّر الاتصال.")});
});

/* التنقل بين التبويبات */
$("tabs").addEventListener("click",function(e){
  var b=e.target.closest("button[data-t]");if(!b)return;var tab=b.getAttribute("data-t");
  Array.prototype.forEach.call($("tabs").children,function(c){c.setAttribute("aria-pressed",String(c===b))});
  ["p","r","s","n","c","a"].forEach(function(k){$("t"+k).classList.toggle("hide",k!==tab)});
  if(tab!=="c")clearInterval(timer);editing=null;renderAll();
});

/* إضافة خدمة */
function create(v){
  var f={n:S(v.n,80),c:S(v.c,30),p:S(v.p,20),w:S(v.w,20),a:S(v.a,120),h:S(v.h,80),d:S(v.d,300),fb:S(v.fb,200),hv:{booleanValue:false},approved:{booleanValue:true},t:S(new Date().toISOString(),40)};
  return add("providers",f);
}
$("ac").innerHTML=CATS.map(function(c){return "<option>"+c+"</option>"}).join("");
$("af").addEventListener("submit",function(e){
  e.preventDefault();say("جاري الإضافة...");
  create({n:$("an").value.trim(),c:$("ac").value,p:$("ap").value.trim(),w:$("aw").value.trim(),a:$("aa").value.trim(),h:$("ah").value.trim(),d:$("ad").value.trim(),fb:$("afb").value.trim()})
  .then(function(r){if(r.ok){$("af").reset();say("تمت الإضافة.");loadAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")});
});
$("imp").addEventListener("click",function(){
  var have={};items.forEach(function(x){have[x.p]=1});
  var todo=LEGACY.filter(function(x){return !have[x.p]});
  if(!todo.length){say("الأسماء القديمة موجودة بالفعل.");return}
  say("جاري الاستيراد...");
  Promise.all(todo.map(create)).then(function(rs){var bad=rs.filter(function(r){return !r.ok});if(bad.length)fail(bad[0]);else say("تم استيراد "+todo.length+".");loadAll()}).catch(function(){say("تعذّر الاتصال.")});
});
