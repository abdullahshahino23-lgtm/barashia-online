<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>لوحة تحكم البراشية أون لاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1E8;--card:#ffffff;--ink:#12332B;--mute:#52665F;--line:#E6DFD0;
  --g:#1F6B52;--gt:#ffffff;--o:#E08A2E;--ot:#12332B;--red:#B3261E;
  --chip:#E1ECE6;--star:#E0A100;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1B17;--card:#162821;--ink:#EEF3F0;--mute:#A9BCB4;--line:#26413A;
    --g:#2E8B6B;--red:#F2766D;--chip:#1F3A32;--star:#F2B93B;color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Cairo',Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 90px}
h1{font-size:21px;margin:6px 0 12px;font-weight:800;display:flex;align-items:center;justify-content:space-between}
input,select,textarea{width:100%;min-height:44px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:14.5px;background:var(--card);color:var(--ink);transition:border-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--g)}
textarea{padding:10px 12px;min-height:76px;resize:vertical}
label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;font-weight:700;margin-bottom:10px}
label.cb{flex-direction:row;align-items:center;gap:8px;cursor:pointer}
label.cb input{width:20px;min-height:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:12px;border:0;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;background:var(--g);color:var(--gt);transition:opacity .2s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.o{background:var(--o);color:var(--ot)}
.btn.s{background:var(--chip);color:var(--ink)}
.btn.r{background:transparent;color:var(--red);border:1px solid var(--red)}
.btn[disabled]{opacity:.55;pointer-events:none}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:11px;box-shadow:0 2px 6px rgba(0,0,0,.02)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
