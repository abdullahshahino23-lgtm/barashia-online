.ah .mark{width:62px;height:62px;display:block;margin:0 auto 4px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.28))}
.ah h1{margin:0;font-size:24px;font-weight:900;color:#fff;text-shadow:0 3px 14px rgba(4,20,48,.35)}
.ah h1 span{color:#F5C518}

h1{font-size:22px;margin:8px 0 12px}
h2{font-size:17px;font-weight:800;margin:20px 0 10px;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:5px;height:19px;border-radius:3px;background:linear-gradient(180deg,var(--o),var(--g2));flex:none}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:15px;padding:0 14px;font:inherit;font-size:15px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s ease,box-shadow .15s ease}

textarea{padding:10px 14px;min-height:80px;resize:vertical}
label{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:700;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:15px;border:0;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:linear-gradient(135deg,var(--g),var(--g2));color:var(--gt);box-shadow:0 4px 14px rgba(10,61,143,.25);transition:transform .12s ease,box-shadow .2s ease}

.btn.d{background:linear-gradient(135deg,#C62828,#A51F1F);color:#fff;box-shadow:0 4px 14px rgba(198,40,40,.3)}
.btn[disabled]{opacity:.6;cursor:default}
.box{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:12px;box-shadow:var(--sh)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nm{font-weight:800;font-size:16.5px;line-height:1.4}
.sub{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 11px;border-radius:99px;background:var(--chip);color:var(--ink)}
.tag.off{background:#FBE4E1;color:#7A1812}
.tag.wait{background:linear-gradient(135deg,var(--o),var(--o2));color:var(--ot)}
@media (prefers-color-scheme:dark){.tag.off{background:#4A1D19;color:#FFD8D3}}
.tabs{display:flex;gap:8px;margin:10px 0;padding:4px 2px 8px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;min-height:42px;padding:0 16px;border-radius:99px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(10,31,61,.06);transition:background .15s ease,color .15s ease,box-shadow .15s ease}
.tab:active{transform:scale(.97)}
.tab[aria-pressed="true"]{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(10,61,143,.3)}
.st{color:var(--star);letter-spacing:1px}
#msg{font-size:14px;font-weight:700;color:var(--g2);min-height:22px;text-align:center}
.hide{display:none}
.msgs{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:18px;padding:12px;background:var(--card);margin:8px 0;box-shadow:var(--sh)}
.m{max-width:85%;padding:9px 13px;border-radius:16px;margin-bottom:8px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.m.u{background:var(--chip);color:var(--ink);border-end-start-radius:5px}
.m.a{background:linear-gradient(135deg,var(--g),var(--g2));color:var(--gt);margin-inline-start:auto;border-end-end-radius:5px;box-shadow:0 3px 10px rgba(10,61,143,.22)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;font-weight:900;color:var(--g)}
.bar{height:9px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--g3));border-radius:99px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div class="wrap">
<div class="ah"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#0A3D8F"/><circle cx="32" cy="32" r="28.5" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/><path d="M31 12 L31 40 L13 40 Z" fill="#ffffff"/><path d="M35 20 L35 40 L49 40 Z" fill="#ffffff"/><path d="M9 44 L55 44 L49 51 L15 51 Z" fill="#F5C518"/></svg><h1>لوحة إدارة <span>دليل دمياط</span></h1><p class="bsub">دليلك اليومي لكل خدمات المحافظة</p></div>

<form id="lf" class="box">
  <label>البريد الإلكتروني<input id="em" type="email" required autocomplete="username"></label>
  <label>كلمة المرور<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">دخول</button>
</form>

<div id="app" class="hide">
  <div class="row" style="justify-content:space-between"><span id="cnt" class="sub"></span><button class="btn s" id="out" type="button">خروج</button></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-t="p" aria-pressed="true" type="button">مقدمو الخدمة</button>
    <button class="tab" data-t="r" aria-pressed="false" type="button">التقييمات</button>
    <button class="tab" data-t="c" aria-pressed="false" type="button">المحادثات</button>
    <button class="tab" data-t="a" aria-pressed="false" type="button">إضافة</button>
    <button class="tab" data-t="o" aria-pressed="false" type="button">الطلبات</button>
    <button class="tab" data-t="m" aria-pressed="false" type="button">العروض</button>
    <button class="tab" data-t="u" aria-pressed="false" type="button">مقترحات</button>
    <button class="tab" data-t="e" aria-pressed="false" type="button">الإعلانات</button>
    <button class="tab" data-t="l" aria-pressed="false" type="button">مفقودات</button>
    <button class="tab" data-t="j" aria-pressed="false" type="button">الوظائف</button>
    <button class="tab" data-t="g" aria-pressed="false" type="button">استشارات تقنية</button>
    <button class="tab" data-t="s" aria-pressed="false" type="button">إحصائيات</button>
  </div>

  <section id="tp">
    <input id="q" type="search" placeholder="ابحث بالاسم أو الهاتف">
    <div class="tabs" id="ftabs">
      <button class="tab" data-f="all" aria-pressed="true" type="button">الكل</button>
      <button class="tab" data-f="on" aria-pressed="false" type="button">ظاهر</button>
      <button class="tab" data-f="off" aria-pressed="false" type="button">مخفي</button>
    </div>
    <select id="fc" aria-label="القسم"></select>
    <div id="plist" style="margin-top:10px"></div>
  </section>

  <section id="tr" class="hide"><div id="rlist"></div></section>

  <section id="tc" class="hide">
    <div id="clist"></div>
    <div id="cview" class="hide box">
      <div class="row" style="justify-content:space-between"><b id="ctitle"></b><span class="row"><button class="btn d" id="cdel" type="button">حذف</button><button class="btn s" id="cback" type="button">رجوع</button></span></div>
      <div class="msgs" id="cmsgs"></div>
      <div class="row"><input id="cr" maxlength="500" placeholder="اكتب ردّك" style="flex:1"><button class="btn" id="csend" type="button">إرسال</button></div>
    </div>
  </section>

  <section id="to" class="hide"><div id="olist"></div></section>
  <section id="tm" class="hide"><div id="mlist"></div></section>
  <section id="tu" class="hide"><div id="ulist"></div></section>
  <section id="te" class="hide">
    <form id="nf" class="box">
      <label>نوع الإعلان<select id="nk"><option>فرح</option><option>وفاة</option><option>مناسبة</option><option>تنبيه</option><option>عرض</option></select></label>
      <label>العنوان<input id="nn" required maxlength="100"></label>
      <label>التفاصيل<textarea id="nd" maxlength="400"></textarea></label>
      <label>التاريخ والموعد<input id="ndt" maxlength="100"></label>
      <label>المكان<input id="npl" maxlength="100"></label>
      <label>يظهر حتى تاريخ<input id="nu" type="date"></label>
      <button class="btn" type="submit">نشر الإعلان</button>
    </form>
    <div id="elist"></div>
  </section>
  <section id="tl" class="hide"><div id="llist"></div></section>
  <section id="tj" class="hide">
    <form id="jf" class="box">
      <label>المسمى الوظيفي<input id="jti" required maxlength="80"></label>
      <label>اسم الشركة / صاحب العمل<input id="jco" required maxlength="60"></label>
      <label>التفاصيل<textarea id="jx" maxlength="300"></textarea></label>
      <label>رقم التليفون<input id="jp" required inputmode="tel" maxlength="20"></label>
      <label>المكان<input id="jpl" maxlength="100"></label>
      <button class="btn" type="submit">نشر الوظيفة</button>
    </form>
    <div id="jlist"></div>
  </section>
  <section id="tg" class="hide"><div id="glist"></div></section>
  <section id="ts" class="hide"><div id="stats"></div><div class="row"><button class="btn s" id="exp" type="button">تصدير مقدمي الخدمة CSV</button></div></section>

  <section id="ta" class="hide">
    <form id="af" class="box">
      <label>الاسم<input id="an" required></label>
      <label>القسم<select id="ac"></select></label>
      <label>الهاتف<input id="ap" required inputmode="tel"></label>
      <label>الواتساب<input id="aw" inputmode="tel"></label>
      <label>العنوان<input id="aa"></label>
      <label>المواعيد<input id="ah"></label>
      <label>الوصف<textarea id="ad"></textarea></label>
      <label>رابط فيسبوك<input id="afb"></label>
      <label>صورة / لوجو (اختياري)<input id="aimgf" type="file" accept="image/*"></label>
      <label>خدمة منزلية / توصيل<select id="ahv"><option value="0">لا</option><option value="1">نعم</option></select></label>
      <label>خط العرض (lat)<input id="alat" inputmode="decimal"></label><label>خط الطول (lng)<input id="alng" inputmode="decimal"></label>
      <button class="btn o" type="submit">إضافة</button>
    </form>
    <button class="btn s hide" id="imp" type="button">استيراد الأسماء القديمة (٣)</button>
  </section>
</div>
<p id="msg" role="status"></p>
</div>

}

}

function loadAll(){
  runQ("",{from:[{collectionId:"providers"}],limit:1000}).then(function(ds){
    items=ds.map(function(d){var f=d.fields||{};return {id:d.name.split("/").pop(),n:sv(f,"n"),c:sv(f,"c"),p:sv(f,"p"),w:sv(f,"w"),a:sv(f,"a"),h:sv(f,"h"),d:sv(f,"d"),fb:sv(f,"fb"),img:sv(f,"img"),hv:!!(f.hv&&f.hv.booleanValue),lat:nv(f,"lat"),lng:nv(f,"lng"),t:sv(f,"t"),on:!!(f.approved&&f.approved.booleanValue)}});
    items.sort(function(a,b){return a.t<b.t?1:a.t>b.t?-1:0});
    return runQ("",{from:[{collectionId:"reviews"}],limit:2000});
  }).then(function(ds){
    revs=ds.map(function(d){var f=d.fields||{};return {id:d.name.split("/").pop(),pid:sv(f,"pid"),n:sv(f,"n"),s:nv(f,"s")||0,x:sv(f,"x"),t:sv(f,"t"),on:!!(f.approved&&f.approved.booleanValue)}});
    revs.sort(function(a,b){return a.t<b.t?1:a.t>b.t?-1:0});
    return runQ("",{from:[{collectionId:"chats"}],orderBy:[{field:{fieldPath:"t"},direction:"DESCENDING"}],limit:200}).catch(function(){return []});
  }).then(function(ds){
    chats=ds.map(function(d){var f=d.fields||{};return {id:d.name.split("/").pop(),n:sv(f,"n"),last:sv(f,"last"),t:sv(f,"t"),from:sv(f,"from")}});
    renderAll();
  }).catch(function(e){if(!e||e.message!=="q")say("تعذّر تحميل البيانات: "+(e&&e.message||"خطأ غير معروف"))});
}

var STS=["جديد","جاري التوصيل","تم التسليم","ملغي"];
function renderO(){
  if(!orders.length){$("olist").innerHTML='<div class="box sub">لا توجد طلبات توصيل.</div>';return}
  $("olist").innerHTML=orders.map(function(x){
    return '<div class="box"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(x.pn)+'</span><span class="tag'+(x.st==="جديد"?" wait":x.st==="ملغي"?" off":"")+'">'+esc(x.st)+'</span></div>'+
    '<div><b>'+esc(x.cn)+'</b> • <a href="tel:'+att(x.cp)+'">'+esc(x.cp)+'</a></div><div class="sub">'+esc(x.ca)+'</div><div>'+esc(x.x)+'</div>'+
    '<div class="sub">المطلوب: '+(x.pr+x.fee)+' جنيه'+(x.pr?' (المنتج '+x.pr+' + توصيل '+x.fee+')':' (رسوم التوصيل '+x.fee+')')+' • '+esc(x.t.slice(0,16).replace("T"," "))+'</div>'+
    '<div class="row" style="margin-top:8px">'+STS.filter(function(s){return s!==x.st}).map(function(s){return '<button class="btn s" data-s="'+att(s)+'" data-id="'+att(x.id)+'" type="button">'+esc(s)+'</button>'}).join("")+'<button class="btn d" data-del="'+att(x.id)+'" type="button">حذف</button></div></div>';
  }).join("");
}
$("olist").addEventListener("click",function(e){var b=e.target.closest("button[data-s]");if(!b)return;var id=b.getAttribute("data-id"),s=b.getAttribute("data-s"),x=orders.filter(function(i){return i.id===id})[0];
  say("جاري التنفيذ...");patch("/orders/"+id,{st:S(s,20)},["st"]).then(function(r){if(r.ok){x.st=s;say("تم.");renderO();badges()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})});
