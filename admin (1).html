<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>إدارة البراشية أون لاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E7;--card:#fff;--ink:#12332B;--mute:#4A5F58;--line:#E4DCCB;--g:#1F6B52;--gt:#fff;--o:#E08A2E;--ot:#12332B;--chip:#DDE9E3;--star:#E0A100;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1D19;--card:#172A24;--ink:#EEF3F0;--mute:#A7BAB2;--line:#26413A;--g:#2E8B6B;--chip:#1F3A32;--star:#F2B93B;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding:16px 16px 80px}
h1{font-size:22px;margin:8px 0 12px}
h2{font-size:17px;margin:16px 0 8px}
input,select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:15px;background:var(--card);color:var(--ink)}
textarea{padding:10px 12px;min-height:70px}
label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600;margin-bottom:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;border:0;font:inherit;font-weight:800;font-size:14px;cursor:pointer;background:var(--g);color:var(--gt)}
.btn.o{background:var(--o);color:var(--ot)}
.btn.s{background:var(--chip);color:var(--ink)}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.nm{font-weight:800;font-size:16px}
.sub{font-size:13px;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:99px;background:var(--chip)}
.tag.off{background:#F7DDDA;color:#7A1812}
.tag.wait{background:#FFE9C7;color:#6B4200}
.tabs{display:flex;gap:6px;margin:10px 0;overflow-x:auto}
.tab{flex:none;min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.st{color:var(--star)}
#msg{font-size:14px;color:var(--mute);min-height:22px}
.hide{display:none}
.msgs{max-height:45vh;overflow:auto;border:1px solid var(--line);border-radius:14px;padding:10px;background:var(--card);margin:8px 0}
.m{max-width:85%;padding:8px 12px;border-radius:14px;margin-bottom:8px;font-size:14px;white-space:pre-wrap;word-break:break-word}
.m.u{background:var(--chip)}
.m.a{background:var(--g);color:var(--gt);margin-inline-start:auto}
.btn.d{background:#B3261E;color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.bar{height:8px;border-radius:99px;background:var(--chip);overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--g)}
</style>
</head>
<body>
<div class="wrap">
<h1>لوحة إدارة البراشية أون لاين</h1>

<form id="lf" class="box">
  <label>البريد الإلكتروني<input id="em" type="email" required autocomplete="username"></label>
  <label>كلمة المرور<input id="pw" type="password" required autocomplete="current-password"></label>
  <button class="btn" type="submit">دخول</button>
</form>

<div id="app" class="hide">
  <div class="row" style="justify-content:space-between"><span id="cnt" class="sub"></span><button class="btn s" id="out" type="button">خروج</button></div>
  <div class="tabs" id="tabs">
    <button class="tab" data-t="p" aria-pressed="true" type="button">مقدمو الخدمة</button>
    <button class="tab" data-t="r" aria-pressed="false" type="button">التقييمات</button>
    <button class="tab" data-t="c" aria-pressed="false" type="button">المحادثات</button>
    <button class="tab" data-t="a" aria-pressed="false" type="button">إضافة</button>
    <button class="tab" data-t="o" aria-pressed="false" type="button">الطلبات</button>
    <button class="tab" data-t="m" aria-pressed="false" type="button">العروض</button>
    <button class="tab" data-t="u" aria-pressed="false" type="button">مقترحات</button>
    <button class="tab" data-t="e" aria-pressed="false" type="button">الأخبار</button>
    <button class="tab" data-t="s" aria-pressed="false" type="button">إحصائيات</button>
  </div>

  <section id="tp">
    <input id="q" type="search" placeholder="ابحث بالاسم أو الهاتف">
    <div class="tabs" id="ftabs">
      <button class="tab" data-f="all" aria-pressed="true" type="button">الكل</button>
      <button class="tab" data-f="on" aria-pressed="false" type="button">ظاهر</button>
      <button class="tab" data-f="off" aria-pressed="false" type="button">مخفي</button>
    </div>
    <select id="fc" aria-label="القسم"></select>
    <div id="plist" style="margin-top:10px"></div>
  </section>

  <section id="tr" class="hide"><div id="rlist"></div></section>

  <section id="tc" class="hide">
    <div id="clist"></div>
    <div id="cview" class="hide box">
      <div class="row" style="justify-content:space-between"><b id="ctitle"></b><span class="row"><button class="btn d" id="cdel" type="button">حذف</button><button class="btn s" id="cback" type="button">رجوع</button></span></div>
      <div class="msgs" id="cmsgs"></div>
      <div class="row"><input id="cr" maxlength="500" placeholder="اكتب ردّك" style="flex:1"><button class="btn" id="csend" type="button">إرسال</button></div>
    </div>
  </section>

  <section id="to" class="hide"><div id="olist"></div></section>
  <section id="tm" class="hide"><div id="mlist"></div></section>
  <section id="tu" class="hide"><div id="ulist"></div></section>
  <section id="te" class="hide">
    <form id="nf" class="box">
      <label>نوع الإعلان<select id="nk"><option value="wedding">أفراح</option><option value="death">وفاة</option><option value="event">مناسبة</option></select></label>
      <label>العنوان<input id="nn" required maxlength="100"></label>
      <label>التفاصيل<textarea id="nd" maxlength="400"></textarea></label>
      <label>التاريخ والمكان<input id="ndt" maxlength="100"></label>
      <button class="btn" type="submit">نشر الإعلان</button>
    </form>
    <div id="elist"></div>
  </section>
  <section id="ts" class="hide"><div id="stats"></div><div class="row"><button class="btn s" id="exp" type="button">تصدير مقدمي الخدمة CSV</button></div></section>

  <section id="ta" class="hide">
    <form id="af" class="box">
      <label>الاسم<input id="an" required></label>
      <label>القسم<select id="ac"></select></label>
      <label>الهاتف<input id="ap" required inputmode="tel"></label>
      <label>الواتساب<input id="aw" inputmode="tel"></label>
      <label>العنوان<input id="aa"></label>
      <label>المواعيد<input id="ah"></label>
      <label>الوصف<textarea id="ad"></textarea></label>
      <label>رابط فيسبوك<input id="afb"></label>
      <label>صورة / لوجو (اختياري)<input id="aimgf" type="file" accept="image/*"></label>
      <label>خدمة منزلية / توصيل<select id="ahv"><option value="0">لا</option><option value="1">نعم</option></select></label>
      <label>خط العرض (lat)<input id="alat" inputmode="decimal"></label><label>خط الطول (lng)<input id="alng" inputmode="decimal"></label>
      <button class="btn o" type="submit">إضافة</button>
    </form>
    <button class="btn s hide" id="imp" type="button">استيراد الأسماء القديمة (٣)</button>
  </section>
</div>
<p id="msg" role="status"></p>
</div>

<script>
var FB="https://firestore.googleapis.com/v1/projects/barashia-online/databases/(default)/documents";
var KEY="AIzaSyAkTo0Bw-UlRK-6KRzIpaPjJbESufhezeA";
var AUTH="https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key="+KEY;
var REFRESH="https://securetoken.googleapis.com/v1/token?key="+KEY;
var CATS=["أطباء","صيدليات","مستشفيات ومعامل","سباكة","كهرباء","نجارة","حدادة","دهانات","مواد بناء","ميكانيكا وصيانة سيارات","مواصلات","توصيل","محلات","مطاعم","حلاقة وتجميل","معلمون ودروس","أجهزة وموبايلات","مزارع ومواشي","خدمات حكومية","أخرى"];
var LEGACY=[
  {n:"Shahino AI",c:"أخرى",p:"01050766025",a:"شارع البحر",h:"١٢ ص إلى ١٢ م"},
  {n:"ماركت أولاد ضياء النجار",c:"محلات",p:"01223510363",a:"بجوار محطة الرفع، منزل الحاج رجب طرية",h:"من ٩ صباحًا إلى ٣ بعد منتصف الليل"},
  {n:"وليد صبري",c:"مواصلات",p:"01009358868",a:"البراشية",h:"٢٤ ساعة"}
];
var tok=null,rtok=null,items=[],revs=[],chats=[],tab="p",flt="all",editing=null,curChat=null,timer=null;
var $=function(i){return document.getElementById(i)};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function att(s){return esc(s).replace(/"/g,"&quot;")}
function say(t){$("msg").textContent=t||""}
function sv(f,k){return f&&f[k]&&f[k].stringValue!=null?f[k].stringValue:""}
function nv(f,k){if(!f||!f[k])return null;var v=f[k];if(v.doubleValue!=null)return +v.doubleValue;if(v.integerValue!=null)return +v.integerValue;return null}
function S(v,n){return {stringValue:String(v==null?"":v).slice(0,n)}}
function stars(n){return "★★★★★".slice(0,n)+"☆☆☆☆☆".slice(0,5-n)}

function refresh(){
  return fetch(REFRESH,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:"grant_type=refresh_token&refresh_token="+encodeURIComponent(rtok)})
  .then(function(r){return r.json()}).then(function(j){if(!j.id_token)throw new Error("x");tok=j.id_token;rtok=j.refresh_token||rtok});
}
function api(url,opt,retried){
  opt.headers={"Content-Type":"application/json","Authorization":"Bearer "+tok};
  return fetch(url,opt).then(function(r){
    if(r.status===401&&!retried&&rtok){return refresh().then(function(){return api(url,opt,true)})}
    return r;
  });
}
function fail(r){var b=r&&r.status===403?"ليس لديك صلاحية. تأكد من القواعد وبريد الأدمن.":"حصلت مشكلة. حاول مرة أخرى.";say(b+(r&&r.status?" (HTTP "+r.status+")":""));try{r.clone().json().then(function(j){var e=j&&j.error;if(e)say(b+" ["+(e.status||r.status)+"] "+String(e.message||"").slice(0,120))}).catch(function(){})}catch(x){}}
function runQ(parent,q){
  return api(FB+(parent||"")+":runQuery?key="+KEY,{method:"POST",body:JSON.stringify({structuredQuery:q})})
  .then(function(r){if(!r.ok){fail(r);throw new Error("q")}return r.json()})
  .then(function(d){return (Array.isArray(d)?d:[]).filter(function(x){return x.document}).map(function(x){return x.document})});
}
function patch(path,fields,mask){
  return api(FB+path+"?key="+KEY+mask.map(function(m){return "&updateMask.fieldPaths="+m}).join(""),{method:"PATCH",body:JSON.stringify({fields:fields})});
}

$("lf").addEventListener("submit",function(e){
  e.preventDefault();say("جاري الدخول...");
  fetch(AUTH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("em").value.trim(),password:$("pw").value,returnSecureToken:true})})
  .then(function(r){return r.json()}).then(function(j){
    if(j.idToken){tok=j.idToken;rtok=j.refreshToken;$("pw").value="";$("lf").classList.add("hide");$("app").classList.remove("hide");say("");loadAll()}
    else{var m=(j.error&&j.error.message)||"",c={EMAIL_NOT_FOUND:"البريد غير مسجل في Firebase.",INVALID_PASSWORD:"كلمة المرور غير صحيحة.",INVALID_LOGIN_CREDENTIALS:"البريد أو كلمة المرور غير صحيحة، أو الحساب غير موجود.",OPERATION_NOT_ALLOWED:"الدخول بالبريد وكلمة المرور غير مفعّل في Firebase.",USER_DISABLED:"الحساب معطّل.",TOO_MANY_ATTEMPTS_TRY_LATER:"محاولات كثيرة، انتظر قليلًا ثم حاول."};say((c[m.split(" ")[0]]||"فشل الدخول")+(m?" ("+m+")":""))}
  }).catch(function(){say("تعذّر الاتصال.")});
});
$("out").addEventListener("click",function(){tok=rtok=null;clearInterval(timer);$("app").classList.add("hide");$("lf").classList.remove("hide");say("")});

function loadAll(){
  runQ("",{from:[{collectionId:"providers"}],limit:1000}).then(function(ds){
    items=ds.map(function(d){var f=d.fields||{};return {id:d.name.split("/").pop(),n:sv(f,"n"),c:sv(f,"c"),p:sv(f,"p"),w:sv(f,"w"),a:sv(f,"a"),h:sv(f,"h"),d:sv(f,"d"),fb:sv(f,"fb"),img:sv(f,"img"),hv:!!(f.hv&&f.hv.booleanValue),lat:nv(f,"lat"),lng:nv(f,"lng"),t:sv(f,"t"),on:!!(f.approved&&f.approved.booleanValue)}});
    items.sort(function(a,b){return a.t<b.t?1:a.t>b.t?-1:0});
    return runQ("",{from:[{collectionId:"reviews"}],limit:2000});
  }).then(function(ds){
    revs=ds.map(function(d){var f=d.fields||{};return {id:d.name.split("/").pop(),pid:sv(f,"pid"),n:sv(f,"n"),s:nv(f,"s")||0,x:sv(f,"x"),t:sv(f,"t"),on:!!(f.approved&&f.approved.booleanValue)}});
    revs.sort(function(a,b){return a.t<b.t?1:a.t>b.t?-1:0});
    return runQ("",{from:[{collectionId:"chats"}],orderBy:[{field:{fieldPath:"t"},direction:"DESCENDING"}],limit:200}).catch(function(){return []});
  }).then(function(ds){
    chats=ds.map(function(d){var f=d.fields||{};return {id:d.name.split("/").pop(),n:sv(f,"n"),last:sv(f,"last"),t:sv(f,"t"),from:sv(f,"from")}});
    renderAll();
  }).catch(function(e){if(!e||e.message!=="q")say("تعذّر تحميل البيانات: "+(e&&e.message||"خطأ غير معروف"))});
}
function renderAll(){
  $("cnt").textContent="مقدمو الخدمة: "+items.length+" • التقييمات: "+revs.length+" • المحادثات: "+chats.length;
  renderP();renderR();renderC();renderS();badges();loadX();
}
function rm(u){return api(u+"?key="+KEY,{method:"DELETE"})}
function norm(s){return String(s||"").replace(/[٠-٩]/g,function(d){return d.charCodeAt(0)-1632}).replace(/[\s\-()]/g,"")}
function okPhone(p){return /^\+?\d{8,15}$/.test(p)}
function rateNum(pid){var a=revs.filter(function(r){return r.pid===pid&&r.on&&r.s});var t=0;a.forEach(function(r){t+=r.s});return {a:a.length?t/a.length:0,k:a.length}}
function rate(pid){var r=rateNum(pid);return r.k?' • <span class="st">★ '+r.a.toFixed(1)+'</span> ('+r.k+')':''}
function nameOf(pid){var x=items.filter(function(i){return i.id===pid})[0];return x?x.n:"(غير معروف)"}

function renderP(){
  var q=$("q").value.trim();
  var r=items.filter(function(x){if(flt==="on"&&!x.on)return false;if(flt==="off"&&x.on)return false;if($("fc").value&&x.c!==$("fc").value)return false;return !q||(x.n+" "+x.p+" "+x.c+" "+x.a+" "+x.d).indexOf(q)>-1});
  if(!r.length){$("plist").innerHTML='<div class="box sub">لا توجد نتائج.</div>';return}
  $("plist").innerHTML=r.map(function(x){
    if(editing===x.id){
      return '<div class="box"><label>الاسم<input id="en" value="'+att(x.n)+'"></label>'+
      '<label>القسم<select id="ec">'+CATS.map(function(c){return '<option'+(c===x.c?" selected":"")+'>'+c+'</option>'}).join("")+'</select></label>'+
      '<label>الهاتف<input id="ep" value="'+att(x.p)+'"></label><label>الواتساب<input id="ew" value="'+att(x.w)+'"></label>'+
      '<label>العنوان<input id="ea" value="'+att(x.a)+'"></label><label>المواعيد<input id="eh" value="'+att(x.h)+'"></label>'+
      '<label>الوصف<textarea id="ed">'+esc(x.d)+'</textarea></label><label>فيسبوك<input id="efb" value="'+att(x.fb)+'"></label>'+
      '<label>خدمة منزلية / توصيل<select id="ehv"><option value="0"'+(x.hv?"":" selected")+'>لا</option><option value="1"'+(x.hv?" selected":"")+'>نعم</option></select></label>'+
      '<label>خط العرض (lat)<input id="elat" inputmode="decimal" value="'+att(x.lat==null?"":x.lat)+'"></label><label>خط الطول (lng)<input id="elng" inputmode="decimal" value="'+att(x.lng==null?"":x.lng)+'"></label>'+
      '<label>صورة / لوجو (اختياري)<input id="eimg" type="file" accept="image/*"></label>'+'<div class="row"><button class="btn" data-a="save" data-id="'+att(x.id)+'" type="button">حفظ</button><button class="btn s" data-a="cancel" type="button">إلغاء</button></div></div>';
    }
    return '<div class="box"><div class="row" style="justify-content:space-between"><span class="nm">'+esc(x.n)+'</span><span class="tag'+(x.on?"":" off")+'">'+(x.on?"ظاهر":"مخفي")+'</span></div>'+
    (x.img?'<img src="'+att(x.img)+'" alt="" style="width:56px;height:56px;border-radius:12px;object-fit:cover">':'')+'<div class="sub">'+esc(x.c)+' • '+esc(x.p)+rate(x.id)+'</div><div class="sub">'+esc(x.a)+(x.h?" • "+esc(x.h):"")+'</div>'+(x.d?'<div class="sub">'+esc(x.d)+'</div>':'')+
    '<div class="row" style="margin-top:10px"><button class="btn s" data-a="toggle" data-id="'+att(x.id)+'" type="button">'+(x.on?"إخفاء":"إظهار")+'</button>'+
    '<button class="btn s" data-a="edit" data-id="'+att(x.id)+'" type="button">تعديل</button><button class="btn d" data-a="del" data-id="'+att(x.id)+'" type="button">حذف</button></div></div>';
  }).join("");
}
$("plist").addEventListener("click",function(e){
  var b=e.target.closest("button[data-a]");if(!b)return;
  var a=b.getAttribute("data-a"),id=b.getAttribute("data-id"),x=items.filter(function(i){return i.id===id})[0];
  if(a==="edit"){editing=id;renderP();return}
  if(a==="cancel"){editing=null;renderP();return}
  if(a==="toggle"){say("جاري التنفيذ...");patch("/providers/"+id,{approved:{booleanValue:!x.on}},["approved"]).then(function(r){if(r.ok){x.on=!x.on;say("تم.");renderAll()}else fail(r)}).catch(function(){say("تعذّر الاتصال.")})}
  if(a==="del"){if(!confirm("حذف "+x.n+" نهائيًا مع تقييماته؟"))return;say("جاري الحذف...");
    Promise.all([rm(FB+"/providers/"+id)].concat(revs.filter(function(r){return r.pid===id}).map(function(r){return rm(FB+"/reviews/"+r.id)}))).then(function(rs){var bad=rs.filter(function(r){return !r.ok});if(bad.length)fail(bad[0]);else say("تم الحذف.");loadAll()}).catch(function(){say("تعذّر الاتصال.")});return}
  if(a==="save"){
    var v={n:$("en").value.trim(),c:$("ec").value,p:$("ep").value.trim(),w:$("ew").value.trim(),a:$("ea").value.trim(),h:$("eh").value.trim(),d:$("ed").value.trim(),fb:$("efb").value.trim()};
    if(!v.n||!v.p){say("الاسم والهاتف مطلوبان.");return}
    v.p=norm(v.p);v.w=norm(v.w);if(!okPhone(v.p)||(v.w&&!okPhone(v.w))){say("رقم الهاتف غير صحيح.");return}
    var hvv=$("ehv").value==="1";
    var la=parseFloat($("elat").value),ln=parseFloat($("elng").value);
    var f={n:S(v.n,80),c:S(v.c,30),p:S(v.p,20),w:S(v.w,20),a:S(v.a,120),h:S(v.h,80),d:S(v.d,300),fb:S(v.fb,200),hv:{booleanValue:$("ehv").value==="1"},
      lat:isNaN(la)?{nullValue:null}:{doubleValue:la},lng:isNaN(ln)?{nullValue:null}:{doubleValue:ln}};
    say("جاري الحفظ...");
    patch("/providers/"+id,(eimg&&(f.img=S(eimg,200000)),f),["n","c","p","w","a","h","d","fb","hv","lat","lng"].concat(eimg?["img"]:[])).then(function(r){
      if(r.ok){x.n=v.n;x.c=v.c;x.p=v.p;x.w=v.w;x.a=v.a;x.h=v.h;x.d=v.d;x.fb=v.fb;x.hv=hvv;eimg="";editing=null;say("تم الحفظ.");loadAll()}else fail(r);
    }).catch(function(){say("تعذّر الاتصال.")});
  }
});
$("q").addEventListener("input",renderP);
